<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Адмін панель - Управління цінами</title>
  <style>
    :root {
      --bg: #000000;
      --card: #111111;
      --text: #ffffff;
      --muted: #cccccc;
      --accent: #ff0000;
      --accent-2: #ff6600;
      --shadow: 0 0 20px rgba(255, 0, 0, 0.5);
      --success: #00aa00;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      line-height: 1.6;
      color: var(--text);
      background: var(--bg);
      background-image: radial-gradient(circle at center, rgba(255, 0, 0, 0.1) 0%, transparent 50%),
        radial-gradient(circle at top left, rgba(255, 102, 0, 0.1) 0%, transparent 50%);
    }

    .container {
      width: min(1000px, calc(100% - 2rem));
      margin: 0 auto;
    }

    header {
      padding: 2rem 0;
      text-align: center;
      border-bottom: 2px solid rgba(255, 0, 0, 0.3);
      margin-bottom: 2rem;
    }

    header h1 {
      margin: 0 0 0.5rem;
      font-size: 2.5rem;
      color: var(--accent);
      text-shadow: 0 0 10px var(--accent);
    }

    header p {
      margin: 0;
      color: var(--muted);
    }

    .admin-content {
      display: grid;
      gap: 2rem;
      margin-bottom: 2rem;
    }

    .section {
      background: var(--card);
      border-radius: 24px;
      padding: 2rem;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 0, 0, 0.3);
    }

    .section h2 {
      margin-top: 0;
      color: var(--accent-2);
      text-shadow: 0 0 10px var(--accent-2);
    }

    .form-group {
      margin-bottom: 1.5rem;
      display: grid;
      gap: 0.5rem;
    }

    label {
      font-weight: 600;
      color: var(--accent);
    }

    input[type="text"],
    input[type="number"],
    textarea {
      padding: 0.75rem 1rem;
      border: 1px solid rgba(255, 0, 0, 0.3);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.5);
      color: var(--text);
      font-family: inherit;
      font-size: 1rem;
    }

    input[type="text"]:focus,
    input[type="number"]:focus,
    textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(255, 0, 0, 0.3);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .price-row {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 1rem;
      margin-bottom: 1rem;
      padding: 1rem;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 12px;
      align-items: end;
    }

    .price-row > div {
      display: grid;
      gap: 0.3rem;
    }

    .price-row label {
      font-size: 0.9rem;
    }

    .btn-delete {
      padding: 0.75rem 1rem;
      background: #cc0000;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .btn-delete:hover {
      background: #ff0000;
      box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
    }

    .add-item-btn {
      padding: 0.75rem 1.5rem;
      background: var(--accent-2);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .add-item-btn:hover {
      background: #ff7722;
      box-shadow: 0 0 10px rgba(255, 102, 0, 0.5);
    }

    .buttons {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-top: 2rem;
      flex-wrap: wrap;
    }

    .btn-save {
      padding: 1rem 2rem;
      background: var(--success);
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
      font-size: 1.1rem;
      transition: all 0.3s ease;
      box-shadow: 0 0 20px rgba(0, 170, 0, 0.3);
    }

    .btn-save:hover {
      background: #00cc00;
      box-shadow: 0 0 30px rgba(0, 170, 0, 0.6);
      transform: translateY(-2px);
    }

    .btn-reset {
      padding: 1rem 2rem;
      background: #666;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
      font-size: 1.1rem;
      transition: all 0.3s ease;
    }

    .btn-reset:hover {
      background: #888;
    }

    .btn-back {
      padding: 0.75rem 1.5rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      text-decoration: none;
      display: inline-block;
      transition: all 0.3s ease;
    }

    .btn-back:hover {
      box-shadow: 0 0 20px var(--accent);
      transform: translateY(-2px);
    }

    .message {
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      display: none;
    }

    .message.show {
      display: block;
    }

    .message.success {
      background: rgba(0, 170, 0, 0.2);
      border: 1px solid var(--success);
      color: var(--success);
    }

    .message.error {
      background: rgba(255, 0, 0, 0.2);
      border: 1px solid var(--accent);
      color: var(--accent);
    }

    @media (max-width: 640px) {
      .price-row {
        grid-template-columns: 1fr;
      }

      .buttons {
        flex-direction: column;
      }

      .btn-save,
      .btn-reset {
        width: 100%;
      }
    }
  </style>
  
  <!-- Firebase SDK (compat версия для глобального api firebase.database()) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>⚙️ Адмін панель</h1>
      <p>Управління цінами та текстом</p>
      <a href="index.html" class="btn-back">← Назад на сайт</a>
    </header>

    <div id="message" class="message"></div>

    <div class="admin-content">
      <!-- Живі раки -->
      <div class="section">
        <h2>🦞 Живі раки</h2>
        <div id="liveContainer"></div>
        <button class="add-item-btn" onclick="addLivePrice()">+ Додати позицію</button>
      </div>

      <!-- Варені раки -->
      <div class="section">
        <h2>🍲 Варені раки</h2>
        <div id="cookedContainer"></div>
        <button class="add-item-btn" onclick="addCookedPrice()">+ Додати позицію</button>
      </div>

      <!-- Доповнення -->
      <div class="section">
        <h2>🍺 Доповнення до раків</h2>
        <div id="extrasContainer"></div>
        <button class="add-item-btn" onclick="addExtra()">+ Додати позицію</button>
      </div>

      <!-- Мідії -->
      <div class="section">
        <h2>🦪 Мідії</h2>
        <div id="musselsContainer"></div>
        <button class="add-item-btn" onclick="addMussel()">+ Додати мідію</button>
      </div>

      <!-- Рецепти -->
      <div class="section">
        <h2>🥘 Рецепти раків</h2>
        <div id="recipesContainer"></div>
        <button class="add-item-btn" onclick="addRecipe()">+ Додати рецепт</button>
      </div>

      <!-- Інші тексти -->
      <div class="section">
        <h2>📝 Інші тексти</h2>
        <div class="form-group">
          <label for="deliveryText">Правила доставки:</label>
          <textarea id="deliveryText" placeholder="Введіть текст про доставку"></textarea>
        </div>
        <div class="form-group">
          <label for="workingHours">Години роботи:</label>
          <input type="text" id="workingHours" placeholder="Наприклад: 10:00 - 20:00" />
        </div>
      </div>
    </div>

    <div class="buttons">
      <button class="btn-save" onclick="saveAllChanges()">💾 Зберегти всі зміни</button>
      <button class="btn-reset" onclick="resetToDefaults()">🔄 Відновити стандартні ціни</button>
    </div>
  </div>

  <script src="firebase-config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
