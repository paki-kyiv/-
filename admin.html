<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Адмін панель</title>
  <style>
    :root {
      --bg: #000000;
      --card: #111111;
      --text: #ffffff;
      --muted: #cccccc;
      --accent: #ff0000;
      --accent-2: #ff6600;
      --success: #00dd00;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      line-height: 1.6;
      color: var(--text);
      background: var(--bg);
    }

    .container {
      width: min(1000px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 2rem 0;
    }

    header {
      text-align: center;
      padding: 2rem 0;
      border-bottom: 2px solid var(--accent);
      margin-bottom: 2rem;
    }

    header h1 {
      margin: 0 0 0.5rem;
      color: var(--accent);
      font-size: 2rem;
    }

    header p {
      margin: 0 0 1rem;
      color: var(--muted);
    }

    .btn-back {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background: var(--accent);
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: 0.3s;
    }

    .btn-back:hover {
      background: #cc0000;
    }

    .admin-content {
      margin-bottom: 2rem;
    }

    .section {
      background: var(--card);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 2rem;
      border-left: 4px solid var(--accent-2);
    }

    .section h2 {
      margin-top: 0;
      color: var(--accent-2);
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: var(--text);
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #333;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      font-family: inherit;
      font-size: 1rem;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(255, 0, 0, 0.3);
    }

    .add-item-btn {
      padding: 0.75rem 1.5rem;
      background: var(--accent-2);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.3s;
      width: 100%;
    }

    .add-item-btn:hover {
      background: #ff8800;
    }

    .btn-delete {
      padding: 0.5rem 1rem;
      background: rgba(255, 0, 0, 0.7);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.3s;
    }

    .btn-delete:hover {
      background: var(--accent);
    }

    .buttons {
      display: flex;
      gap: 1rem;
      margin-top: 2rem;
    }

    .btn-save,
    .btn-reset {
      flex: 1;
      padding: 1rem;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 1rem;
      transition: 0.3s;
    }

    .btn-save {
      background: var(--success);
      color: black;
    }

    .btn-save:hover {
      background: #00ff00;
    }

    .btn-reset {
      background: var(--accent-2);
      color: white;
    }

    .btn-reset:hover {
      background: #ff8800;
    }

    .message {
      position: fixed;
      top: 1rem;
      right: 1rem;
      padding: 1rem 2rem;
      border-radius: 8px;
      display: none;
      z-index: 1000;
    }

    .message.show {
      display: block;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        transform: translateX(400px);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    .message.success {
      background: rgba(0, 221, 0, 0.2);
      border: 1px solid var(--success);
      color: var(--success);
    }

    .message.error {
      background: rgba(255, 0, 0, 0.2);
      border: 1px solid var(--accent);
      color: var(--accent);
    }
  </style>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>⚙️ Адмін панель</h1>
      <p>Управління категоріями, цінами та текстом</p>
      <a href="index.html" class="btn-back">← Назад на сайт</a>
    </header>

    <div id="message" class="message"></div>

    <div class="admin-content">
      <div class="section">
        <h2>📦 Категорії та елементи</h2>
        <div id="categoriesContainer"></div>
        <button class="add-item-btn" onclick="addCategory()">+ Додати категорію</button>
      </div>

      <div class="section">
        <h2>🍺 Доповнення до раків</h2>
        <div id="extrasContainer"></div>
        <button class="add-item-btn" onclick="addExtra()">+ Додати позицію</button>
      </div>

      <div class="section">
        <h2>📝 Інші тексти</h2>
        <div class="form-group">
          <label for="deliveryText">Правила доставки:</label>
          <textarea id="deliveryText" placeholder="Введіть текст про доставку"></textarea>
        </div>
        <div class="form-group">
          <label for="workingHours">Години роботи:</label>
          <input type="text" id="workingHours" placeholder="Наприклад: 10:00 - 20:00" />
        </div>
      </div>
    </div>

    <div class="buttons">
      <button class="btn-save" onclick="saveAllChanges()">💾 Зберегти всі зміни</button>
      <button class="btn-reset" onclick="resetToDefaults()">🔄 Відновити стандартні ціни</button>
    </div>
  </div>

  <script src="firebase-config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
